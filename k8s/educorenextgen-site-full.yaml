apiVersion: v1
kind: ConfigMap
metadata:
  name: educorenextgen-website-config
  namespace: educorenextgen
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  MONGODB_URI: "mongodb://educore-db-0.educore-db.educorenextgen.svc.cluster.local:27017"
  MONGODB_DB: "educorenextgen-website"
---
apiVersion: v1
kind: Service
metadata:
  name: educorenextgen-website-service
  namespace: educorenextgen
  labels:
    app: educorenextgen-website
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: educorenextgen-website
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: educorenextgen-website
  namespace: educorenextgen
  labels:
    app: educorenextgen-website
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: educorenextgen-website
  template:
    metadata:
      labels:
        app: educorenextgen-website
        version: v1
    spec:
      imagePullSecrets:
      - name: regcred
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
      
      containers:
        - name: educorenextgen-website
          image: registry.skyfobscloud.com/educorenextgen-website:7
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            # From ConfigMap
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: PORT
            - name: HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: HOSTNAME
            - name: NEXT_TELEMETRY_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: NEXT_TELEMETRY_DISABLED
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: MONGODB_URI
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: MONGODB_DB
            
            # From Secret
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: educorenextgen-website-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: educorenextgen-website-secrets
                  key: TELEGRAM_CHAT_ID
          
          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Startup probe (for slow-starting apps)
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: educorenextgen-website-ingress
  namespace: educorenextgen
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/real-ip-header: "CF-Connecting-IP"
    
spec:
  ingressClassName: nginx

  rules:
    # Main domain
    - host: educorenextgen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educorenextgen-website-service
                port:
                  number: 80
    
    # WWW subdomain
    - host: www.educorenextgen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educorenextgen-website-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: educorenextgen-website-hpa
  namespace: educorenextgen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: educorenextgen-website
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
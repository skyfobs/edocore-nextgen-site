apiVersion: v1
kind: Service
metadata:
  name: educorenextgen-website-headless
  namespace: educorenextgen
  labels:
    app: educorenextgen-website
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: educorenextgen-website
  publishNotReadyAddresses: true

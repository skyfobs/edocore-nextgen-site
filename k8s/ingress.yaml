apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: educorenextgen-website-ingress
  namespace: educorenextgen
  annotations:
    # Nginx Ingress Controller annotations
    kubernetes.io/ingress.class: "nginx"
    
    # SSL/TLS
    cert-manager.io/cluster-issuer: "skyfobscloud-prod"
    
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    
    # Client body size
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Real IP (if behind Cloudflare or other proxy)
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/real-ip-header: "CF-Connecting-IP"
    
spec:
  tls:
    - hosts:
        - educorenextgen.com
        - www.educorenextgen.com
      secretName: educorenextgen-tls-cert
  
  rules:
    # Main domain
    - host: educorenextgen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educorenextgen-website-service
                port:
                  number: 80
    
    # WWW subdomain
    - host: www.educorenextgen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: educorenextgen-website-service
                port:
                  number: 80

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: educorenextgen-website
  namespace: educorenextgen
  labels:
    app: educorenextgen-website
    version: v1
spec:
  serviceName: educorenextgen-website-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: educorenextgen-website
  template:
    metadata:
      labels:
        app: educorenextgen-website
        version: v1
    spec:
      # Security context with fsGroup for Longhorn volumes
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001  # Kubernetes automatically makes volumes writable by this group
        fsGroupChangePolicy: "OnRootMismatch"  # Only change permissions if needed (faster)
      
      containers:
        - name: educorenextgen-website
          image: registry.skyfobscloud.com/educorenextgen-website:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            # From ConfigMap
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: PORT
            - name: HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: HOSTNAME
            - name: NEXT_TELEMETRY_DISABLED
              valueFrom:
                configMapKeyRef:
                  name: educorenextgen-website-config
                  key: NEXT_TELEMETRY_DISABLED
            
            # From Secret
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: educorenextgen-website-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: educorenextgen-website-secrets
                  key: TELEGRAM_CHAT_ID
          
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          
          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Startup probe (for slow-starting apps)
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      
      # Optional: Pod anti-affinity for HA
      # affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #       - weight: 100
      #         podAffinityTerm:
      #           labelSelector:
      #             matchExpressions:
      #               - key: app
      #                 operator: In
      #                 values:
      #                   - educorenextgen-website
      #           topologyKey: kubernetes.io/hostname
  
  # VolumeClaimTemplates for Longhorn
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: educorenextgen-website
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn  # Longhorn storage class
        resources:
          requests:
            storage: 5Gi
    
    - metadata:
        name: logs
        labels:
          app: educorenextgen-website
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn  # Longhorn storage class
        resources:
          requests:
            storage: 2Gi

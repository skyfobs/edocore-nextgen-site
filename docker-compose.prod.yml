version: '3.8'

services:
  educore-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: educore-website:latest
    container_name: educore-nextgen-website-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      # Mount database directory to persist data
      - ./data:/app/data:rw
      # Mount logs directory
      - ./logs:/app/logs:rw
    networks:
      - educore-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false  # Set to true if you want read-only filesystem (requires tmpfs)
    labels:
      - "com.educore.description=EduCore NextGen Website - Production"
      - "com.educore.version=1.0"
      - "com.educore.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  educore-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  educore-data:
    driver: local
